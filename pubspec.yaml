name: receipt_printer
description: "AKTS Receipt Management System for ANU KALPAKKAM TELUGU SAMITHI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.13.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  share_plus: ^10.1.4
  connectivity_plus: ^6.0.5
  shimmer: ^3.0.0
  dio: ^5.7.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/fonts/
